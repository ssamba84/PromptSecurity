<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="440" height="200" rx="8" fill="#f3f4f6"/>
  <text x="20" y="30" fill="#9ca3af" font-size="12">chatgpt.com — after uploading secret.pdf</text>

  <!-- alert card (top-right toast) -->
  <g transform="translate(56,56)">
    <rect x="0" y="0" width="360" height="120" rx="10" fill="#fff5f5" stroke="#f0a6a6" stroke-width="1"/>
    <rect x="0" y="0" width="5" height="120" rx="2" fill="#d92d20"/>
    <text x="20" y="34" font-size="20">⚠️</text>
    <text x="48" y="30" fill="#3a0d0d" font-size="15" font-weight="700">Potential secret detected</text>
    <text x="48" y="52" fill="#3a0d0d" font-size="13" font-weight="600">secret.pdf</text>
    <text x="48" y="72" fill="#3a0d0d" font-size="12">Found: AWS credentials</text>
    <text x="48" y="96" fill="#7a1a1a" font-size="11" opacity="0.8">The upload was not blocked — review before sending.</text>
    <text x="336" y="26" fill="#7a1a1a" font-size="18">×</text>
  </g>
</svg>
